<!DOCTYPE html>
<html>
<head>
  <title>DocuQuery - RAG Assistant</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 2rem auto; padding: 1rem; background: #f8fafc; }
    .card { background: white; border-radius: 16px; padding: 24px; margin: 20px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { background: #10b981; color: white; border: none; font-weight: 600; cursor: pointer; }
    button:hover { background: #059669; }
    #output { background: white; padding: 20px; border-radius: 12px; white-space: pre-wrap; border: 1px solid #e2e8f0; min-height: 120px; }
    .error { color: #dc2626; }
    .success { color: #10b981; }
  </style>
</head>
<body>
  <h1>📄 DocuQuery</h1>
  <p>Upload a document, then ask questions.</p>

  <div class='card'>
    <h3>1️⃣ Upload Document</h3>
    <form id='uploadForm'>
      <input type='file' name='file' accept='.pdf,.docx,.txt' required />
      <button type='submit'>📤 Upload & Process</button>
    </form>
    <p id='uploadStatus'></p>
  </div>

  <div class='card'>
    <h3>2️⃣ Ask a Question</h3>
    <input type='text' id='question' placeholder='e.g., What is this document about?' />
    <select id='style'>
      <option value='default'>Default (Helpful)</option>
      <option value='kid'>🧒 Explain like I'm 5</option>
      <option value='legal'>⚖️ Legal Tone</option>
      <option value='short'>📝 Short Answer</option>
    </select>
    <button onclick='askQuestion()'>🤖 Get Answer</button>
  </div>

  <div id='output'>💬 Answer will appear here...</div>

  <script>
    let documentReady = false;
    
    document.getElementById('uploadForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      document.getElementById('uploadStatus').innerHTML = '⏳ Processing... (may take 10-20 seconds)';
      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.error) {
          document.getElementById('uploadStatus').innerHTML = `<span class='error'>❌ ${data.error}</span>`;
        } else {
          documentReady = true;
          document.getElementById('uploadStatus').innerHTML = `<span class='success'>✅ ${data.message}</span>`;
        }
      } catch (err) {
        document.getElementById('uploadStatus').innerHTML = `<span class='error'>❌ Upload failed</span>`;
      }
    };

    async function askQuestion() {
      const question = document.getElementById('question').value;
      const style = document.getElementById('style').value;
      const output = document.getElementById('output');
      
      if (!question) { output.textContent = 'Please enter a question.'; return; }
      if (!documentReady) { output.innerHTML = '<span class=\'error\'>❌ Please upload a document first.</span>'; return; }
      
      output.innerHTML = '🤔 Thinking...';
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, style })
        });
        const data = await res.json();
        if (data.error) {
          output.innerHTML = `<span class='error'>❌ ${data.error}</span>`;
        } else {
          output.textContent = data.answer;
        }
      } catch (err) {
        output.innerHTML = `<span class='error'>❌ Error: ${err.message}</span>`;
      }
    }
  </script>
</body>
</html>
